ktor:
  deployment:
    port: 8080
    watch:
      - classes
  application:
    modules:
      # Main Plugins
      - net.axcira.ApplicationKt.main
      - net.axcira.plugins.SerializationKt.configureSerialization
      - net.axcira.features.auth.AuthenticationKt.configureAuthentication
      - net.axcira.plugins.OpenApiKt.configureOpenApi
      - net.axcira.plugins.StatusPagePluginKt.statusPage
      - net.axcira.plugins.RoutingKt.root

      # Features
      - net.axcira.ApplicationInitializerKt.subscribe
      - net.axcira.features.auth.v1.AuthRoutingKt.auth
      - net.axcira.features.users.v1.UserRoutingKt.users
      - net.axcira.features.articles.v1.ArticleRoutingKt.articles
      - net.axcira.features.permissions.v1.PermissionRoutingKt.permissions
    dependencies:
      - net.axcira.plugins.DatabasesKt.database
