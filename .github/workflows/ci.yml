name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUN_VERSION: "1.3.14"
  JAVA_VERSION: "25"

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies (root workspace)
        run: bun install --frozen-lockfile

      - name: Generate OpenAPI spec
        run: ./gradlew generateOpenApiJson
        working-directory: backend

      - name: Regenerate Orval client and verify no drift
        run: bun run orval:drift
        working-directory: frontend

      - name: Frontend lint & format check
        run: bun run check
        working-directory: frontend

      - name: Frontend test
        run: bun run test --passWithNoTests
        working-directory: frontend

      - name: Frontend build
        run: bun run build
        working-directory: frontend

      - name: Backend tests
        run: ./gradlew test
        working-directory: backend

      - name: Backend shadowJar
        run: ./gradlew shadowJar
        working-directory: backend
