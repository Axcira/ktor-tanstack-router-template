name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"
  JAVA_VERSION: "25"

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies (root workspace)
        run: bun install --frozen-lockfile

      - name: Lint & format check
        run: bun run check
        working-directory: frontend

      - name: Test
        run: bun run test
        working-directory: frontend

      - name: Build
        run: bun run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Test
        run: ./gradlew test
        working-directory: backend

  api-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies (root workspace)
        run: bun install --frozen-lockfile

      - name: Generate OpenAPI spec
        # Uses codegen source set (not production classpath); sets SKIP_* in the Gradle task
        run: ./gradlew generateOpenApiJson
        working-directory: backend

      - name: Regenerate Orval client and verify no drift
        run: bun run orval:drift
        working-directory: frontend
