name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"
  JAVA_VERSION: "25"
  # Keep in sync with PostgreSQLContainer in backend/src/test/.../BaseTest.kt
  POSTGRES_IMAGE: postgres:18.4

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      api-client: ${{ steps.filter.outputs.api-client }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # push events need history so paths-filter can diff against github.event.before
          fetch-depth: 0

      - name: Detect changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - '.github/workflows/ci.yml'
              - 'frontend/**'
              - 'package.json'
              - 'bun.lock'
            backend:
              - '.github/workflows/ci.yml'
              - 'backend/**'
            api-client:
              - '.github/workflows/ci.yml'
              - 'backend/src/main/**'
              - 'backend/src/codegen/**'
              - 'backend/build.gradle.kts'
              - 'backend/settings.gradle.kts'
              - 'backend/gradle.properties'
              - 'backend/gradle/**'
              - 'frontend/orval.config.ts'
              - 'frontend/src/api/generated/**'
              - 'frontend/package.json'
              - 'bun.lock'

  # Filters apply to pull requests and pushes. `ci` treats a skipped job as success.
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies (root workspace)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint & format check
        run: bun run check
        working-directory: frontend

      - name: Typecheck
        run: bun run typecheck
        working-directory: frontend

      - name: Test
        run: bun run test
        working-directory: frontend

      - name: Build
        run: bun run build
        working-directory: frontend

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # MIT-licensed cache; the v6 default ("enhanced") is proprietary.
          cache-provider: basic

      # Configuration cache entries store absolute jar paths. The dependency
      # cache is immutable after the first write, so a later job can restore
      # those paths without the jars and fail compilation. Let Gradle rebuild
      # the configuration cache in the workspace; the build cache still hits.
      - name: Restore Gradle build cache
        id: gradle-build-cache
        uses: actions/cache/restore@v4
        with:
          path: backend/.gradle/build-cache
          key: gradle-build-cache-backend-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            gradle-build-cache-backend-${{ runner.os }}-

      - name: Check
        working-directory: backend
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          docker pull --quiet "$POSTGRES_IMAGE" &
          pull_pid=$!
          ./gradlew check
          status=$?
          # Cached test runs never touch the image. Don't hold the job open for the pull.
          kill "$pull_pid" 2>/dev/null || true
          wait "$pull_pid" 2>/dev/null || true
          exit "$status"

      - name: Save Gradle build cache
        if: success() && steps.gradle-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: backend/.gradle/build-cache
          key: gradle-build-cache-backend-${{ runner.os }}-${{ github.sha }}

  api-client:
    needs: changes
    if: needs.changes.outputs.api-client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          # `check` resolves a superset of this job's dependencies. Writing from
          # both jobs races on one immutable cache key, and the loser is dropped.
          cache-read-only: true

      # Same configuration-cache hazard as the backend job, and this job cannot
      # refresh the read-only dependency cache after it downloads a missing jar.
      - name: Restore Gradle build cache
        id: gradle-build-cache
        uses: actions/cache/restore@v4
        with:
          path: backend/.gradle/build-cache
          key: gradle-build-cache-api-client-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            gradle-build-cache-api-client-${{ runner.os }}-

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies (root workspace)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Generate OpenAPI spec
        # Uses codegen source set (not production classpath); sets SKIP_* in the Gradle task
        run: ./gradlew generateOpenApiJson
        working-directory: backend

      - name: Save Gradle build cache
        if: success() && steps.gradle-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: backend/.gradle/build-cache
          key: gradle-build-cache-api-client-${{ runner.os }}-${{ github.sha }}

      - name: Regenerate Orval client and verify no drift
        run: bun run orval:drift
        working-directory: frontend

  # Single required check: skipped path-filtered jobs must not block merge.
  ci:
    name: CI
    if: always()
    needs: [changes, frontend, backend, api-client]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          CHANGES: ${{ needs.changes.result }}
          FRONTEND: ${{ needs.frontend.result }}
          BACKEND: ${{ needs.backend.result }}
          API_CLIENT: ${{ needs.api-client.result }}
        run: |
          echo "changes=$CHANGES frontend=$FRONTEND backend=$BACKEND api-client=$API_CLIENT"
          test "$CHANGES" = success
          for r in "$FRONTEND" "$BACKEND" "$API_CLIENT"; do
            test "$r" = success -o "$r" = skipped
          done
